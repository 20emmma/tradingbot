name: Backtest Comparison

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: tradingbot

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest comparison
        run: python3 backtest_compare.py
