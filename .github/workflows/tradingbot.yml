name: Trading Bot Hourly Run

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

defaults:
  run:
    working-directory: tradingbot

jobs:
  run-bot:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot check (Kraken)
        env:
          BOT_MODE: ${{ vars.BOT_MODE }}
          MARKET: kraken
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 run_once.py

      - name: Generate static dashboard
        run: python3 generate_static_dashboard.py

      - name: Commit updated state back to repo
        run: |
          shopt -s nullglob
          git config user.name "tradingbot"
          git config user.email "tradingbot@users.noreply.github.com"
          git add state_*.json status_*.json paper_ledger_*.json docs/index.html
          shopt -u nullglob
          git diff --quiet --cached || git commit -m "Bot run: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tradingbot/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4