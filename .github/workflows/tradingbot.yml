name: Trading Bot Hourly Run

on:
  schedule:
    # Runs at the top of every hour (UTC). GitHub's scheduler can lag by a
    # few minutes under load -- that's normal and doesn't affect strategy
    # correctness, since we always fetch fresh candles at run time.
    - cron: "0 * * * *"
  workflow_dispatch:
    # Lets you manually trigger a run from the GitHub Actions tab, useful
    # for testing without waiting for the next scheduled hour.

# Needed so this workflow can commit state files back to the repo
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot check (Kraken)
        env:
          BOT_MODE: ${{ vars.BOT_MODE }}
          MARKET: kraken
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 run_once.py

      - name: Commit updated state back to repo
        run: |
          git config user.name "tradingbot"
          git config user.email "tradingbot@users.noreply.github.com"
          git add state_*.json status_*.json paper_ledger_*.json 2>/dev/null || true
          git diff --quiet --cached || git commit -m "Bot run: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
